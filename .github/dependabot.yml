# Keep the SHA-pinned actions and the small npm tree current. Mirrors the
# production repo's setup (which also covers the Expo app and the portal).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/London }
    commit-message: { prefix: "chore(actions)" }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/London }
    commit-message: { prefix: "chore(deps)" }
    groups:
      dev-tooling:
        dependency-type: development

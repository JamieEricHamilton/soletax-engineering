# Secret scan — EVERY push, no path filter, ever. (Split out of security.yml
# in the S187 Actions-budget redesign, 2026-07-25.)
#
# Why this is its own workflow: the budget fix path-filtered security.yml so
# docs-only commits stop paying for SAST + npm-audit runs that have nothing to
# scan. But the secret scan must NOT ride that filter — docs commits are the
# single most likely place for a pasted credential to land (the setup manifest,
# the session log, Zone F expiry tables). So gitleaks lives here, unfiltered,
# ~1 billable minute per push, and the expensive gates live behind the filter.
#
# The weekly Monday full pass in security.yml still runs its own gitleaks job
# (schedule/dispatch-only there) so the fleet-report aggregation keeps its
# input. Same binary version, same .gitleaks.toml allowlist — keep them in step.
name: Secret scan

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true # gitleaks scans FULL history, so the newest run covers everything a cancelled one would have

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history — leaks hide in old commits
      # Fetch and detect are SEPARATE steps (S214: a GitHub-releases 503 on the
      # download failed the bundled step and fired the "secret found" alert —
      # an infra hiccup must never read as a finding). Retries absorb the
      # transient 503 class; a persistent fetch failure fails the workflow
      # visibly but alerts nobody.
      - name: fetch gitleaks (pinned 8.30.1)
        run: curl -sSfL --retry 4 --retry-delay 5 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: gitleaks (allowlist = .gitleaks.toml)
        id: scan
        run: ./gitleaks detect --redact
      # Detection path: the moment a secret is flagged, email the fleet alert.
      # No commit here (a push carrying a secret must not also race a findings
      # commit); the weekly fleet-report job records it on the board.
      - name: Alert the fleet on a secret hit
        if: failure() && steps.scan.outcome == 'failure'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Send the secret-scan alert
        if: failure() && steps.scan.outcome == 'failure'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/security-agent.mjs --alert-secret
